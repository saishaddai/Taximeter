<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Taximeter App</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0d7ff2",
              "background-light": "#f5f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex items-center p-4">
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] text-slate-900 dark:text-white flex-1">Taximeter</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex h-12 w-12 cursor-pointer items-center justify-center overflow-hidden rounded-full text-slate-700 dark:text-slate-300">
<span class="material-symbols-outlined text-2xl">
                        settings
                    </span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-col flex-1 px-4 pb-4">
<!-- Charging Level Chips -->
<div class="flex gap-3 pt-2 justify-center">
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary/20 px-4">
<p class="text-sm font-medium leading-normal text-primary dark:text-primary-300">Standard</p>
</div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-slate-700/50 px-4">
<p class="text-sm font-medium leading-normal text-slate-600 dark:text-slate-300">Night</p>
</div>
<div class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-200 dark:bg-slate-700/50 px-4">
<p class="text-sm font-medium leading-normal text-slate-600 dark:text-slate-300">Premium</p>
</div>
</div>
<!-- Primary Display Card -->
<div class="flex-1 flex flex-col items-center justify-center py-6">
<div class="relative flex w-full max-w-sm flex-col items-center justify-center rounded-xl bg-white/50 dark:bg-slate-800/20 p-4 shadow-sm">
<button class="absolute top-4 right-4 flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-2xl">
                            share
                        </span>
</button>
<!-- Fare -->
<p class="pt-8 text-base font-normal leading-normal text-slate-600 dark:text-slate-400">Fare</p>
<h1 class="text-slate-900 dark:text-white tracking-tight text-7xl font-bold leading-tight py-1">$25.50</h1>
<div class="inline-flex items-center gap-1.5 rounded-full px-2 py-1 bg-green-100 dark:bg-green-900/40 mt-1">
<div class="h-2 w-2 rounded-full bg-green-500"></div>
<p class="text-xs font-medium text-green-700 dark:text-green-300">In Progress</p>
</div>
<!-- Stats -->
<div class="flex w-full flex-wrap gap-4 pt-8">
<div class="flex min-w-0 flex-1 flex-col gap-1 rounded-xl bg-slate-100 dark:bg-slate-900/60 p-4">
<p class="text-base font-medium leading-normal text-slate-700 dark:text-slate-300">Distance</p>
<p class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">5.2 km</p>
</div>
<div class="flex min-w-0 flex-1 flex-col gap-1 rounded-xl bg-slate-100 dark:bg-slate-900/60 p-4">
<p class="text-base font-medium leading-normal text-slate-700 dark:text-slate-300">ETA</p>
<p class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">12 min</p>
</div>
</div>
</div>
</div>
<!-- Ride Control Button -->
<div class="pt-4 pb-2">
<button class="flex w-full max-w-[480px] cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-full h-16 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] mx-auto shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1, 'wght' 500;">
                        stop_circle
                    </span>
                    Stop Ride
                </button>
</div>
</main>
</div>
</body></html>
